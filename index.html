<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GALA · reproductor</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .msg{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
    color:#cfd8d6;font-family:system-ui,-apple-system,sans-serif;font-size:14px;text-align:center}
</style>
</head>
<body>
  <div class="msg" id="msg">Cargando video…</div>
  <script>
    // Reproductor genérico de GALA. Recibe el ID de YouTube por la URL:
    //   .../index.html?id=LJoerNNdEyo   (o ?v=LJoerNNdEyo)
    // Al estar servido desde https, el embed de YouTube funciona aunque la
    // ficha que lo incrusta sea un archivo local abierto desde el celular.
    (function () {
      var q = new URLSearchParams(location.search);
      var id = (q.get('id') || q.get('v') || '').replace(/[^\w-]/g, '').slice(0, 20);
      var msg = document.getElementById('msg');
      if (!id) { msg.textContent = 'Falta el ID del video.'; return; }
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube.com/embed/' + id +
              '?autoplay=1&rel=0&playsinline=1&modestbranding=1';
      f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('title', 'Video del hotel');
      document.body.appendChild(f);
      msg.style.display = 'none';
    })();
  </script>
</body>
</html>
